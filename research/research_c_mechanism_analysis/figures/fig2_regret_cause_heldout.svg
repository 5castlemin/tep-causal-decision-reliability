<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" xmlns:c2pa="http://c2pa.org/manifest"><style>.t{font:13px system-ui,-apple-system,'Noto Sans KR',sans-serif;fill:#191919}.s{font:12px system-ui,sans-serif;fill:#666}.g{stroke:#e5e5e5;stroke-width:1}.ax{stroke:#999;stroke-width:1}
@media (prefers-color-scheme:dark){.t{fill:#efefef}.s{fill:#9c9c9c}.g{stroke:#333}.bg{fill:#191919}}</style><rect class="bg" width="760" height="300" fill="#fff"/>
<text class="t" x="16" y="22" font-weight="600">그림 2. Regret&gt;0 인 SCM 수와 원인 (Held-out, 200 SCM 중)</text>
<rect x="16" y="36" width="10" height="10" rx="2" fill="#257de0"/><text class="t" x="32" y="45">수정 그래프에 X→Y 유향 경로 없음 → 예측 효과 0 → k=0 선택</text>
<rect x="16" y="52" width="10" height="10" rx="2" fill="#f47230"/><text class="t" x="32" y="61">경로는 있으나 예측 효과 부호가 반대</text>
<text class="t" x="160" y="99.0" text-anchor="end">S0 (무수정)</text>
<rect x="170" y="82" width="391.0" height="26" rx="3" fill="#257de0"><title>S0 (무수정): 경로 없음 49</title></rect>
<rect x="563.0" y="82" width="47.0" height="26" rx="3" fill="#f47230"><title>S0 (무수정): 부호 반대 6</title></rect>
<text class="t" x="618.0" y="99.0">49 + 6 = 55</text>
<text class="t" x="160" y="141.0" text-anchor="end">M2 단독 B=2</text>
<rect x="170" y="124" width="423.0" height="26" rx="3" fill="#257de0"><title>M2 단독 B=2: 경로 없음 53</title></rect>
<rect x="595.0" y="124" width="39.0" height="26" rx="3" fill="#f47230"><title>M2 단독 B=2: 부호 반대 5</title></rect>
<text class="t" x="642.0" y="141.0">53 + 5 = 58</text>
<text class="t" x="160" y="183.0" text-anchor="end">Canonical Oracle B=2</text>
<rect x="170" y="166" width="175.0" height="26" rx="3" fill="#257de0"><title>Canonical Oracle B=2: 경로 없음 22</title></rect>
<rect x="347.0" y="166" width="31.0" height="26" rx="3" fill="#f47230"><title>Canonical Oracle B=2: 부호 반대 4</title></rect>
<text class="t" x="386.0" y="183.0">22 + 4 = 26</text>
<text class="t" x="160" y="225.0" text-anchor="end">Full Greedy B=2</text>
<rect x="170" y="208" width="63.0" height="26" rx="3" fill="#257de0"><title>Full Greedy B=2: 경로 없음 8</title></rect>
<rect x="235.0" y="208" width="23.0" height="26" rx="3" fill="#f47230"><title>Full Greedy B=2: 부호 반대 3</title></rect>
<text class="t" x="266.0" y="225.0">8 + 3 = 11</text>
<text class="t" x="160" y="267.0" text-anchor="end">M4 단독 B=2</text>
<rect x="170" y="250" width="31.0" height="26" rx="3" fill="#257de0"><title>M4 단독 B=2: 경로 없음 4</title></rect>
<rect x="203.0" y="250" width="15.0" height="26" rx="3" fill="#f47230"><title>M4 단독 B=2: 부호 반대 2</title></rect>
<text class="t" x="226.0" y="267.0">4 + 2 = 6</text>
