name: 입력과 코드 검증
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -X utf8 graphs/final/verify_and_load.py
      - run: python -X utf8 -m unittest discover -s tests -v
      - run: python -X utf8 experiments/simulator/validate_feasibility.py
      - run: python -X utf8 experiments/simulator/diagnostics/validate_diagnostics.py
      - run: python -X utf8 scripts/validate_benchmark_decision.py
      - run: python -X utf8 scripts/validate_track_a_recovery.py
      - run: python -X utf8 scripts/validate_track_b_audit.py
      - run: python -X utf8 scripts/validate_ref_b_minimal_records.py
      - run: python -X utf8 scripts/validate_decision_mvp.py
      - run: python -X utf8 scripts/validate_env_acceptance.py
      - run: python -X utf8 scripts/validate_first_integrated_pilot.py
      - run: python -X utf8 scripts/validate_repeated_metric_pilot.py
      - run: python -X utf8 scripts/validate_diverse_structure_pilot.py
      - run: python -X utf8 scripts/validate_independent_confirmation.py
      - run: python -X utf8 scripts/validate_path_metric_incremental.py
      - run: python -X utf8 scripts/validate_decision_reliability_next.py
      - run: python -X utf8 scripts/validate_manufacturing_validity.py
      - run: python -X utf8 scripts/validate_environment_contract.py
      - run: python -X utf8 scripts/validate_tep_valve_transition_contract.py
      - run: python -X utf8 scripts/validate_bounded_dynamic_protocol.py
      - run: python -X utf8 scripts/check_research_state.py
      - run: python -X utf8 scripts/check_asset_manifest.py
      - run: python -X utf8 scripts/validate_pr_integration.py
      - name: 연구 상태 문서 동기화
        if: github.event_name == 'pull_request'
        run: python -X utf8 scripts/check_research_docs.py --base origin/${{ github.base_ref }}
      # 원자료는 비공개 CI 저장소에 올리지 않는다. 로컬에서 별도 해시 대조.
