name: TEP operating condition single execution
on:
  push:
    branches: [feature/tep-operating-condition-reconstruction]
jobs:
  probe:
    if: contains(github.event.head_commit.message, '[tep-operating-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed source in isolated environment
        run: |
          git clone https://github.com/khalidlabs/tep-studio.git "$RUNNER_TEMP/tep-studio"
          git -C "$RUNNER_TEMP/tep-studio" checkout 852f0c69ab974540750d61bd1dbfafd56bfd80bb
          python -m venv "$RUNNER_TEMP/tep-venv"
          "$RUNNER_TEMP/tep-venv/bin/pip" install "$RUNNER_TEMP/tep-studio"
          "$RUNNER_TEMP/tep-venv/bin/python" -V
          gcc --version | head -1
      - name: Run fixed sequential conditions
        run: /usr/bin/time -v "$RUNNER_TEMP/tep-venv/bin/python" scripts/run_tep_operating_condition_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tep-operating-condition
          path: tep_operating_output/
          if-no-files-found: warn
